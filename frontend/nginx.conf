server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # ── React SPA: all non-file routes fall back to index.html ───────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Health & Readiness checks ─────────────────────────────────────────────
    location ~ ^/(health|ready)$ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Backend API proxy (prefixed with /api/) ──────────────────────────────
    # Used when frontend is built with VITE_API_URL=/api (recommended for Docker).
    # Strips /api/ and proxies to backend:8000 on the internal Docker network.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / streaming support (unbuffered, chunked)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;

        # File uploads
        client_max_body_size 50m;
    }

    # ── Backend API proxy (direct paths without /api/) ────────────────────────
    # Fallback to allow direct API calls on port 80 without /api/ prefix.
    location ~ ^/(auth|upload|research|download|sources|retrieval|metrics|trace|history|session|admin)(/|$) {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / streaming support
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        chunked_transfer_encoding on;

        # File uploads
        client_max_body_size 50m;
    }
}
